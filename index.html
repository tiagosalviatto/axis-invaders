<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Axis Invaders</title>
  <!-- ?v= forces browsers to fetch matching versions of every file after a
       release (GitHub Pages lets them cache each file for 10 minutes, which
       otherwise mixes old and new files). Bump it on every release. -->
  <link rel="stylesheet" href="styles.css?v=20261015b">

  <!-- Install to home screen: opens fullscreen like an app -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Axis Invaders">
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hint">&larr; &uarr; &darr; &rarr; / WASD : mover &nbsp;&middot;&nbsp; Space : atirar / confirmar &nbsp;&middot;&nbsp; R : ranking &nbsp;&middot;&nbsp; P : pausa</div>

  <div id="nameEntry" class="hidden">
    <label for="nameInput">SEU NOME</label>
    <input id="nameInput" type="text" maxlength="16" autocomplete="off" spellcheck="false">
    <button id="nameSave">COMEÇAR</button>
  </div>

  <script src="src/sprites.js?v=20261015b"></script>
  <script src="src/audio.js?v=20261015b"></script>
  <script src="src/input.js?v=20261015b"></script>
  <script src="src/ui.js?v=20261015b"></script>
  <script src="src/touch.js?v=20261015b"></script>
  <script src="src/ships.js?v=20261015b"></script>
  <script src="src/stages.js?v=20261015b"></script>
  <script src="src/entities.js?v=20261015b"></script>
  <script src="src/config.js?v=20261015b"></script>
  <script src="src/scoreboard.js?v=20261015b"></script>
  <script src="src/game.js?v=20261015b"></script>
  <script src="src/main.js?v=20261015b"></script>
</body>
</html>
